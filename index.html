 else if(sets=='acc'||sets=='cat'){const t=sets,K=t=='acc'?[['A','Aset'],['L','Liabilitas'],['Q','Ekuitas']]:[['I','Penerimaan'],['E','Pengeluaran']],kl=K.find(k=>k[0]==mk[t])[1];b=`<section class=cd><div class=chips>${K.map(([k,l])=>`<button class="${mk[t]==k?'on':''}" onclick="mk['${t}']='${k}';render()">${l}</button>`).join('')}</div>${mk[t]=='Q'?'<p class=mut>Ekuitas (modal pemilik/usaha) bisa diisi nanti; tampil di Neraca setelah ada akunnya.</p>':''}<div class=row style="margin:6px 0"><button class=pri onclick="nodeForm('${t}','${mk[t]}','','')">+ ${kl} induk</button><button onclick="xa(1)">Buka semua</button><button onclick="xa(0)">Tutup semua</button></div><div id=mg>${mgrH(t)}</div></section>`}
